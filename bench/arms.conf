# Sourced by bench/run_arm.sh (bash). PROTOCOL.md A3 (4-bit arms) and A10 (DRA-74 comparator arms).
# Every value here is part of the result record: run_arm.sh hashes this file into driver-sha256.txt.

# A3: empty -> the arm is recorded NOT_RUN. A10: VLLM_NVFP4 below supersedes the legacy VLLM4 arm.
SGLANG_IMG=
MODEL4=
GGUF4=

# OURS (A10): prebuilt server, checked by sha256 before launch; AIEN_OMEGA_FP8_GROUPED_WAVE is passed
# explicitly. bin-19173f9e carries no reader of that variable (grep -c GROUPED_WAVE = 0 on its
# aien-serve-http and libomega_gpu.a), so 0 records the behaviour it has, not a lever setting.
OURS_BIN_DIR=${OURS_BIN_DIR:-/home/drakestapleton/.local/state/aien-q36/bin-19173f9e}
OURS_BIN_SHA256=${OURS_BIN_SHA256:-19173f9ec3b609fe79af644f84741d8808b92ea8eb3ecec4bc945af6f22b3aeb}
OURS_WAVE=${OURS_WAVE:-0}

# nvidia/Qwen3.6-35B-A3B-NVFP4@1355db6a052410cfd62085d94b58866fd0f2c3c5 (hf_quant_config MIXED_PRECISION:
# W4A16 NVFP4 experts, FP8 linear attention, FP8 KV cache, bf16 MTP head); sha list verified 15/15.
MODEL_NVFP4=/home/drakestapleton/models/qwen3.6-35b-a3b-nvfp4-1355db6a
NSYS_DIR=/opt/nvidia/nsight-systems/2025.3.2

# FP8: the backends vLLM chose by itself in the A1 session (DeepGEMM MoE, FlashAttention), pinned so a
# version default cannot drift; KV dtype auto as in A1 (the FP8-vs-NVFP4 KV dtype confound is in A10).
for a in VLLM_FP8 VLLM_FP8_MTP VLLM_FP8_MTP2; do
  ARM_MODEL[$a]=$MODEL; ARM_UTIL[$a]=0.50; ARM_KV[$a]=auto
  ARM_ATTN[$a]=FLASH_ATTN; ARM_MOE[$a]=deep_gemm; ARM_PREFIX[$a]=off
done
ARM_SPEC[VLLM_FP8_MTP]='{"method":"mtp","num_speculative_tokens":3}'
ARM_SPEC[VLLM_FP8_MTP2]='{"method":"mtp","num_speculative_tokens":2}'

# NVFP4: modelopt (resolves to modelopt_mixed on this checkpoint), FP8 KV as the checkpoint declares,
# FlashInfer attention (FP8 KV), Marlin W4A16 MoE. The MTP draft is bf16, so its MoE runs on Triton.
for a in VLLM_NVFP4 VLLM_NVFP4_MTP VLLM_NVFP4_NSYS; do
  ARM_MODEL[$a]=$MODEL_NVFP4; ARM_UTIL[$a]=0.50; ARM_QUANT[$a]=modelopt; ARM_KV[$a]=fp8
  ARM_ATTN[$a]=FLASHINFER; ARM_MOE[$a]=marlin; ARM_PREFIX[$a]=off
done
ARM_SPEC[VLLM_NVFP4_MTP]='{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
ARM_PROFILE[VLLM_NVFP4_NSYS]=nsys
unset a
